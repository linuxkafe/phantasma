use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - google
      - bing
server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "changeme"
redis:
  enabled: false
ui:
  static_use_hash: true
  default_locale: "pt"
search:
  formats:
    - html
    - json
  safe_search: 1
  autocomplete: "duckduckgo"
  default_lang: "pt"
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddu
    use_http: true
    timeout: 5.0
  - name: google
    engine: google
    shortcut: gg
    use_http: true
    timeout: 5.0
  - name: bing
    engine: bing
    shortcut: bng
    use_http: true
    timeout: 5.0