services:
  searxng:
    image: searxng/searxng:latest
    container_name: phantasma-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      - INSTANCE_NAME=phantasma-search
    networks:
      - phantasma-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  phantasma-net:
    external: true