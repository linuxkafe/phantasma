services:
  # Main pHantasma voice assistant
  phantasma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phantasma
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "audio"
    env_file:
      - .env
    environment:
      - ALSA_DEVICE_IN=hw:0,0
      - ALSA_DEVICE_OUT=hw:0,0
      - OLLAMA_HOST_PRIMARY=http://10.0.0.128:11434
      - OLLAMA_HOST_FALLBACK=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
      - SKILLS_DIR=/app/skills
      - MEMORY_DB_PATH=/app/data/memory.db
      - BRAIN_DB_PATH=/app/data/flybrain.db
      - TTS_MODEL_PATH=/app/models/tts/pt_PT-dii-high.onnx
      - MUSIC_DIR=/app/audio/music
      - GREETING_PATH=/app/audio/greeting.wav
    volumes:
      - ./data:/app/data
      - ./data/whisper:/root/.cache/whisper
      - ./models:/app/models
      - ./audio:/app/audio
      - ./config.py:/app/config.py:ro
      - ./assistant.py:/app/assistant.py:ro
      - ./audio_utils.py:/app/audio_utils.py:ro
      - ./data_utils.py:/app/data_utils.py:ro
      - ./tools.py:/app/tools.py:ro
      - ./src:/app/src:ro
      - ./skills:/app/skills:ro
      - .env:/app/.env:ro
    ports:
      - "5000:5000"
    healthcheck:
      # Image has no curl/wget; use python stdlib urllib instead.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,urllib.error; resp=urllib.request.urlopen('http://localhost:5000/health',timeout=3); import sys; sys.exit(0 if resp.status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - phantasma-net
    depends_on:
      - ollama
      - searxng

  # Secondary Ollama (fallback) - small model for HP Mini PC 600
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-secondary
    restart: unless-stopped
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    networks:
      - phantasma-net
    deploy:
      resources:
        limits:
          memory: 2G
    command: serve
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # SearXNG search engine
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8081:8080"
    networks:
      - phantasma-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  phantasma-net:
    driver: bridge