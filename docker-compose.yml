services:
  # Main pHantasma voice assistant
  phantasma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phantasma
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "audio"
    env_file:
      - .env
    environment:
      - ALSA_DEVICE_IN=0
      - ALSA_DEVICE_OUT=hw:0,0
      - OLLAMA_HOST_PRIMARY=http://10.0.0.128:11434
      - OLLAMA_HOST_FALLBACK=http://ollama:11434
      - OLLAMA_MODEL_FALLBACK=phi3:mini
      - SEARXNG_URL=http://searxng:8080
      - SKILLS_DIR=/app/skills
      - MEMORY_DB_PATH=/app/data/memory.db
      - BRAIN_DB_PATH=/app/data/flybrain.db
      - TTS_MODEL_PATH=/app/models/tts/pt_PT-dii-high.onnx
      - MUSIC_DIR=/app/audio/music
      - GREETING_PATH=/app/audio/greeting.wav
    volumes:
      - ${PHANTASMA_DATA_DIR:-./data}:/app/data
      - ${PHANTASMA_DATA_DIR:-./data}/whisper:/root/.cache/whisper
      - ./models:/app/models
      - ./audio:/app/audio
      - ./config.py:/app/config.py:ro
      - ./assistant.py:/app/assistant.py:ro
      - ./audio_utils.py:/app/audio_utils.py:ro
      - ./data_utils.py:/app/data_utils.py:ro
      - ./tools.py:/app/tools.py:ro
      - ./src:/app/src:ro
      - ./skills:/app/skills:ro
      - .env:/app/.env:ro
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,urllib.error; resp=urllib.request.urlopen('http://localhost:5000/health',timeout=3); import sys; sys.exit(0 if resp.status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - phantasma-net
    depends_on:
      - searxng
      - ollama

  # Ollama fallback - small Portuguese-capable model for HP Mini PC 600
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - phantasma-net
    deploy:
      resources:
        limits:
          memory: 3G
    command: serve
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434 && echo OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Ollama model pull (runs once after ollama is healthy)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh","-c","ollama pull phi3:mini && echo 'model pulled'"]
    networks:
      - phantasma-net
    restart: "no"

  # SearXNG search engine
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8081:8080"
    networks:
      - phantasma-net
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; import sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  phantasma-net:
    driver: bridge