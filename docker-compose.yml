services:
  # Main pHantasma voice assistant
  phantasma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phantasma
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "audio"
    env_file:
      - .env
    environment:
      - ALSA_DEVICE_IN=0
      - ALSA_DEVICE_OUT=hw:0,0
      - OLLAMA_HOST_PRIMARY=http://10.0.0.128:11434
      - OLLAMA_HOST_FALLBACK=http://ollama:11434
      - OLLAMA_MODEL_FALLBACK=qwen3:8b
      - SEARXNG_URL=http://searxng:8080
      - SKILLS_DIR=/app/skills
      - MEMORY_DB_PATH=/app/data/memory.db
      - BRAIN_DB_PATH=/app/data/flybrain.db
      - TTS_MODEL_PATH=/app/models/tts/pt_PT-dii-high.onnx
      - MUSIC_DIR=/app/audio/music
      - GREETING_PATH=/app/audio/greeting.wav
    volumes:
      - ${PHANTASMA_DATA_DIR:-./data}:/app/data
      - ${PHANTASMA_DATA_DIR:-./data}/whisper:/root/.cache/whisper
      - ./models:/app/models
      - ./audio:/app/audio
      - ./config.py:/app/config.py:ro
      - ./assistant.py:/app/assistant.py:ro
      - ./audio_utils.py:/app/audio_utils.py:ro
      - ./data_utils.py:/app/data_utils.py:ro
      - ./tools.py:/app/tools.py:ro
      - ./src:/app/src:ro
      - ./skills:/app/skills:ro
      - .env:/app/.env:ro
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,urllib.error; resp=urllib.request.urlopen('http://localhost:5000/health',timeout=3); import sys; sys.exit(0 if resp.status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - phantasma-net
    depends_on:
      - searxng
      - ollama

  # Ollama fallback - small Portuguese-capable model for HP Mini PC 600
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    networks:
      - phantasma-net
    deploy:
      resources:
        limits:
          memory: 10G
    command: serve
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434 && echo OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Ollama model pull (runs once after ollama is healthy)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh","-c","ollama pull phi3:mini && echo 'model pulled'"]
    networks:
      - phantasma-net
    restart: "no"

  # SearXNG search engine
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8081:8080"
    networks:
      - phantasma-net
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; import sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# MQTT broker for Zigbee2MQTT. Not reachable from the LAN on purpose: nothing
  # outside this machine needs it, and the previous plan in
  # docs/ZIGBEE_INTEGRATION.md mapped 1883 to 0.0.0.0 with allow_anonymous --
  # an unauthenticated broker on the LAN that switches an oven plug.
  #
  # The config is written by the entrypoint command rather than bind-mounted:
  # a file mounted over /mosquitto/config in this image replaces the directory
  # the image ships its own mosquitto.conf in, which is a confusing way to
  # lose a config file.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    command: >
      sh -c "printf 'listener 1883\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf
      && exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    volumes:
      - mosquitto-data:/mosquitto/data
    ports:
      # Loopback only. The assistant is a systemd service on the HOST, not a
      # container in this file, so it cannot reach a bridge network by name --
      # it needs a port on the host, and this one is not on any other
      # interface.
      - "127.0.0.1:1883:1883"
    networks:
      - phantasma-net
    healthcheck:
      # A publish, not a subscribe. `mosquitto_sub -C 1 -W 2` exits non-zero
      # every time, because no one publishes to the topic it waits for -- which
      # is a probe that can only ever report the broker as dead. A publish
      # succeeds only if the broker accepted it.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health/probe -m ok"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Zigbee2MQTT: the coordinator that owns /dev/ttyUSB0 (the Sonoff Zigbee 3.0
  # USB Dongle Plus, a ZBDongle-P / CC2652P running Z-Stack 3.x.0).
  #
  # Two things here are measured, not remembered:
  #   * adapter is `zstack`, not `ezsp` and not `znp`. Z2M 2.14.2 rejects
  #     `znp` outright ("serial/adapter must be equal to one of the allowed
  #     values") and auto-discovery fails on this dongle with "No valid USB
  #     adapter found", so the adapter has to be stated.
  #   * Z2M will not start at all without an MQTT broker. It boots into an
  #     onboarding server and exits there. There is no REST API to fall back
  #     on in 2.x -- /api is a WebSocket and everything else is the SPA.
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    devices:
      # The by-id symlink, not /dev/ttyUSB0. The ttyUSB number is assigned by
      # probe order and moves when any other USB serial device appears; the
      # serial number in the path does not. This one has sat at ttyUSB0 for
      # months, which is exactly the kind of coincidence that expires.
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_d8d38f2bff9def11910cd2a661ce3355-if00-port0:/dev/ttyUSB0
    volumes:
      - zigbee2mqtt-data:/app/data
    ports:
      # Bound to loopback only: the frontend and its WebSocket can switch the
      # oven. 8080 is already taken on this host, hence 8090.
      - "127.0.0.1:8090:8080"
    networks:
      - phantasma-net

networks:
  phantasma-net:
    driver: bridge

volumes:
  mosquitto-data:
  # Named volume, not a bind mount: this directory receives the generated
  # `advanced.network_key` and `coordinator_backup.json` on first boot. A bind
  # mount would put a Zigbee network key inside the working tree, where the
  # next `git add -A` would stage it.
  zigbee2mqtt-data: