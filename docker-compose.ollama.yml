services:
  ollama:
    image: ollama/ollama:latest
    container_name: phantasma-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - phantasma-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  phantasma-net:
    external: true