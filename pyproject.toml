[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pHantasma"
version = "0.1.0"
description = "Local-first, offline, modular voice assistant in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "openai-whisper",
    "ollama",
    "torch",
    "httpx",
    "flask",
    "openwakeword",
    "tinytuya",
    "psutil",
    "python-miio",
    "webrtcvad",
    "piper-tts",
    "soundfile",
    "setuptools>=61,<81",
    "zeroconf",
    "librosa",
    "discord",
    "dio-chacon-wifi-api",
]
optional-dependencies = {dev = ["pytest", "pytest-cov", "ruff", "mypy"], dotenv = ["python-dotenv"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=term --cov-fail-under=30"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
# Untyped third-party dependencies
[[tool.mypy.overrides]]
module = [
    "openwakeword.*",
    "webrtcvad.*",
    "whisper.*",
    "ollama.*",
    "piper.*",
    "sounddevice.*",
    "soundfile.*",
    "tinytuya.*",
    "python_miio.*",
    "zeroconf.*",
    "librosa.*",
]
ignore_missing_imports = true