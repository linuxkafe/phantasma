[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pHantasma"
version = "0.1.0"
description = "Local-first, offline, modular voice assistant in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "openai-whisper",
    "ollama",
    "torch",
    "httpx",
    "flask",
    "openwakeword",
    "tinytuya",
    "psutil",
    "python-miio",
    "webrtcvad",
    "piper-tts",
    "soundfile",
    "setuptools",
]
optional-dependencies = {dev = ["pytest", "pytest-cov", "ruff"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=term --cov-fail-under=30"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W", "I"]