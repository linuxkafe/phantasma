[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pHantasma"
version = "0.1.0"
description = "Local-first, offline, modular voice assistant in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    # faster-whisper (CTranslate2, int8) replaced openai-whisper on 2026-09-29:
    # 17.6-27.8s became 7.45s on the same CPU, and the int8 build is ~4x
    # lighter to load. openai-whisper was left in this list after the swap,
    # which is how the package went UNDECLARED and then missing from
    # /opt/phantasma/venv on the very next deploy -- STT failed at runtime with
    # "No module named 'faster_whisper'" while dev worked fine. Declaring what
    # the code imports is not optional bookkeeping.
    "faster-whisper>=1.2,<2",
    "ollama",
    "torch",
    "httpx",
    "flask",
    "openwakeword",
    "tinytuya",
    "psutil",
    "python-miio",
    "webrtcvad",
    "piper-tts",
    "soundfile",
    "setuptools>=61,<81",
    "zeroconf",
    "librosa",
    "discord",
    "dio-chacon-wifi-api",
]
optional-dependencies = {dev = ["pytest", "pytest-cov", "ruff", "mypy"], dotenv = ["python-dotenv"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=term --cov-fail-under=30"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
# Untyped third-party dependencies
[[tool.mypy.overrides]]
module = [
    "openwakeword.*",
    "webrtcvad.*",
    "whisper.*",
    "ollama.*",
    "piper.*",
    "sounddevice.*",
    "soundfile.*",
    "tinytuya.*",
    "python_miio.*",
    "zeroconf.*",
    "librosa.*",
]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# admin.py and design.py are almost entirely inline HTML/CSS. Wrapping a Jinja
# attribute across lines is not a readability win, it is a diff that hides the
# change it makes. The rule stays on everywhere else.
"src/api/admin.py" = ["E402", "E501"]
"src/api/design.py" = ["E501"]
# i18n.py is a table of translated sentences: a translation cannot be wrapped
# without editing the translation.
"src/api/i18n.py" = ["E501"]
# A handful of f-strings in log calls and test assertions read as one line or
# they read as two facts stitched together badly.
"src/pipeline/audio.py" = ["E501"]
"tests/test_admin_nav_layout.py" = ["E501"]
"tests/test_explorer_ui.py" = ["E501"]
"tests/test_memory_graph.py" = ["E501"]
# E402: these modules import after defining a logger or after a docstring-level
# guard on purpose -- moving them to the top creates the import cycle the late
# import avoids.
"tests/conftest.py" = ["E402"]
